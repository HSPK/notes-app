[package]
name = "notes-core"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
argon2 = "0.5"
base64 = "0.22"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
getrandom = "0.3"
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
flate2 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
fs2 = "0.4"
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
uuid = { version = "1", features = ["serde", "v7"] }
yrs = { version = "0.28", features = ["sync", "small-client"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
