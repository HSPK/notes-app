[package]
name = "notes-cli"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[[bin]]
name = "notes-core"
path = "src/main.rs"

[dependencies]
ctrlc = { version = "3.4", features = ["termination"] }
notes-core = { path = "../notes-core" }
rpassword = "7"
serde_json = "1"
zeroize = "1"
