[package]
name = "notes-app-windows"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
build = "build.rs"

[[bin]]
name = "notes"
path = "src/main.rs"

[dependencies]
notes-cli = { path = "../../crates/notes-cli" }
notes-core = { path = "../../crates/notes-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
serde_json = "1"
